<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
    }

    .header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-bottom: 1px solid #2a2a4a;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 .icon { font-size: 20px; }

    .header p {
      font-size: 11px;
      color: #8888aa;
      margin-top: 4px;
    }

    .controls {
      padding: 12px 20px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #1a1a1a;
    }

    .controls button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1a1a1a;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .controls button:hover {
      background: #252525;
      border-color: #555;
      color: #fff;
    }

    .controls button.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    .folder-input {
      padding: 10px 20px;
      border-bottom: 1px solid #1a1a1a;
    }

    .folder-input label {
      font-size: 11px;
      color: #888;
      display: block;
      margin-bottom: 4px;
    }

    .folder-input input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 12px;
      outline: none;
    }

    .folder-input input:focus { border-color: #2563eb; }

    .file-list-container {
      max-height: 320px;
      overflow-y: auto;
    }

    .file-list-container::-webkit-scrollbar { width: 6px; }
    .file-list-container::-webkit-scrollbar-track { background: transparent; }
    .file-list-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .status-bar {
      padding: 10px 20px;
      font-size: 12px;
      color: #888;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-bar .count { color: #2563eb; font-weight: 600; }

    .file-item {
      display: flex;
      align-items: center;
      padding: 8px 20px;
      gap: 10px;
      border-bottom: 1px solid #141414;
      transition: background 0.1s;
    }

    .file-item:hover { background: #161616; }

    .file-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
      cursor: pointer;
      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 12px;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-type {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    .file-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .badge-pdf { background: #3b1a1a; color: #f87171; }
    .badge-doc { background: #1a2a3b; color: #60a5fa; }
    .badge-xls { background: #1a3b1a; color: #4ade80; }
    .badge-img { background: #3b2a1a; color: #fbbf24; }
    .badge-zip { background: #2a1a3b; color: #c084fc; }
    .badge-other { background: #222; color: #888; }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #555;
    }

    .empty-state .big-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }
    .empty-state .hint { font-size: 11px; margin-top: 6px; color: #444; }

    .footer {
      padding: 12px 20px;
      border-top: 1px solid #1a1a1a;
    }

    .download-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .download-btn:hover { background: #1d4ed8; }
    .download-btn:disabled { background: #1a1a2e; color: #444; cursor: not-allowed; }

    .progress-bar {
      height: 3px;
      background: #1a1a1a;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }

    .progress-bar .fill {
      height: 100%;
      background: #2563eb;
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }

    .scan-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1a1a1a;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 8px;
    }

    .scan-btn:hover { background: #252525; border-color: #555; color: #fff; }

    .filter-row {
      padding: 8px 20px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-chip {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-chip:hover { border-color: #555; color: #ccc; }
    .filter-chip.active { background: #2563eb22; border-color: #2563eb; color: #60a5fa; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="icon">📥</span> Batch Doc Downloader</h1>
    <p>Scan, select, and download documents in one click</p>
  </div>

  <div class="folder-input">
    <label>Download folder name</label>
    <input type="text" id="folderName" placeholder="e.g. Project-Documents" />
  </div>

  <div class="controls">
    <button id="selectAll">Select All</button>
    <button id="deselectAll">Deselect All</button>
  </div>

  <div class="filter-row" id="filterRow" style="display:none;"></div>

  <div class="status-bar" id="statusBar" style="display:none;">
    <span><span class="count" id="selectedCount">0</span> selected</span>
    <span id="totalCount">0 found</span>
  </div>

  <div class="file-list-container" id="fileList">
    <div class="empty-state">
      <div class="big-icon">🔍</div>
      <p>Click "Scan Page" to find documents</p>
      <p class="hint">Works on any page with downloadable files</p>
    </div>
  </div>

  <div class="footer">
    <button class="scan-btn" id="scanBtn">🔍 Scan This Page</button>
    <button class="download-btn" id="downloadBtn" disabled>
      <span>⬇</span> Download Selected
    </button>
    <div class="progress-bar" id="progressBar">
      <div class="fill" id="progressFill"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
